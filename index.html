    var weeks={};weeks[iso(mon)]={d:S.d,t:S.t};
    Object.keys(HW).forEach(function(k){if(k!==iso(mon)&&hasData(HW[k].d))weeks[k]={d:HW[k].d,t:HW[k].t}});
    ta.value=JSON.stringify({app:"hours",v:1,saved:new Date().toISOString(),weeks:weeks,types:TY});
    svMsg("Копия готова: недель "+Object.keys(weeks).length+", типов дней "+Object.keys(TY).length+". Нажмите «Скопировать».");
  }else if(a==="imp"){ta.value="";ta.focus();svMsg("Вставьте текст копии в поле и нажмите «Применить».")}
  else if(a==="copy"){if(!ta.value){svMsg("Сначала сделайте копию.");return}svCopy(ta.value,function(t){svMsg(t);bkMark()})}
  else if(a==="apply"){try{var rs=importData(JSON.parse(ta.value));svMsg("Готово: недель в копии "+rs.n+", изменено отметок "+rs.f+". Более новые отметки сохранены, стёртые — возвращены.")}catch(err){svMsg("Не получилось: "+(err&&err.message||"ошибка")+".")}}
  else if(a==="clrw"){clearWeek()}
  else if(a==="trep"){svCopy(telReport(),svMsg)}
  else if(a==="tclr"){TEL.ev=[];TEL.sec=[];try{localStorage.removeItem("hours:tel")}catch(x){}telRender();svMsg("Очищено.")}
  else if(a==="bench"){benchRun(BENCH.dur)}
  else if(a==="snd"){SND=!SND;try{localStorage.setItem("hours:snd",SND?"1":"0")}catch(x){}b.textContent="Звуки: "+(SND?"вкл":"выкл");if(SND){sndClick();setTimeout(sndChime,400)}}
  else if(a==="hap"){haptic();setTimeout(haptic,160);setTimeout(haptic,320);svMsg("Три отклика отправлены. Если ничего не почувствовали: нужен iOS 18+, звук и вибрации включены, режим «Без звука» не мешает не всегда.")}
});

h1.addEventListener("click",function(e){

var _upd=update;update=function(){var t=performance.now();act("update");_upd();tlog("update",performance.now()-t)};
var _fit=fitCards;fitCards=function(){var t=performance.now();_fit();tlog("fitCards",performance.now()-t)};

// новые сутки при открытом приложении → перезапуск на сегодняшний день (данные уже сохранены на устройстве)
function dayCheck(){if(iso(new Date())===iso(now0))return false;var a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.type==="time")return false;try{flushAll()}catch(e){}setTimeout(function(){location.reload()},300);return true}
setInterval(function(){if(dayCheck())return;if(ANIM||(DR&&DR.drag))return;update()},20000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)dayCheck()});
window.addEventListener("pageshow",function(){dayCheck()});
if(reduced)setInterval(tick,1000);else requestAnimationFrame(loop);
</script>
<script>
// ---- PWA: офлайн и обновления (новая версия ставится только по кнопке) ----
(function(){
  if(!("serviceWorker" in navigator))return;
  var asked=false,lastChk=0;
  function offer(w){if(asked)return;asked=true;toast("Есть обновление",function(){w.postMessage("skip")},600000,"Обновить")}
  navigator.serviceWorker.register("sw.js").then(function(reg){
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)offer(w)})});
    function chk(){if(Date.now()-lastChk<30*60000)return;lastChk=Date.now();reg.update().catch(function(){})}
    document.addEventListener("visibilitychange",function(){if(!document.hidden)chk()});
    setInterval(chk,6*3600000);
  }).catch(function(){});
  var rl=false,had=!!navigator.serviceWorker.controller;   // при самой первой установке не перезагружаемся
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(!had){had=true;return}if(rl)return;rl=true;location.reload()});   // первая смена — это установка, дальше — обновления
})();
</script>
